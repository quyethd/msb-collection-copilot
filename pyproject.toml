[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msb-collection-synthetic-data"
version = "1.0.0"
description = "Deterministic synthetic data foundation for MSB Collection Decision Copilot"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

